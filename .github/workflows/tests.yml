name: Tests

on:
  push:
    branches:
      - main
      - chore/project-bootstrap

  pull_request:
    branches:
      - main
    
jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run:  |
          python -m pip install --upgrade pip
          pip install -r requirerements-dev.txt

      - name: Run tests
        run:  |
          python -m pytest -v  