name: HomeOps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Simulate staging failure to test rollback'
        type: boolean
        required: false
        default: false

jobs:
  tests:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - homeops
      - lxc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show Docker version
        run: |
          docker --version

      - name: Build test image
        run: |
          docker build -f Dockerfile.test -t homeops-test:${{ github.sha }} .

      - name: Run tests in container
        run: |
          docker run --rm homeops-test:${{ github.sha }}

      - name: Cleanup test image
        if: always()
        run: |
          docker image rm homeops-test:${{ github.sha }} || true

  publish:
    needs: tests
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/koptchik/homeops:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "$IMAGE" .
      
      - name: Push image
        run: |
          docker push "$IMAGE"

  deploy:
    needs: publish
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch')

    concurrency:
      group: homeops-staging-deploy
      cancel-in-progress: false

    runs-on:
      - self-hosted
      - Linux
      - X64
      - homeops
      - staging

    permissions:
      contents: read
      packages: read

    env:
      IMAGE: ghcr.io/koptchik/homeops:${{ github.sha }}
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show Docker version
        run: |
          docker --version

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: Pull staging image
        run: |
          docker pull "$IMAGE"

      - name: Cleanup stale temporary container
        run: |
          docker rm -f homeops-staging-new || true

      - name: Start test staging container
        run: |
          docker run -d \
            --name homeops-staging-new \
            -p 8001:8000 \
            "$IMAGE"

      - name: Health check test container
        id: test_health
        run: |
          sleep 3
          curl --fail http://127.0.0.1:8001/health

      - name: Show failed test container logs
        if: failure() && steps.test_health.outcome == 'failure'
        run: |
          docker logs homeops-staging-new || true

      - name: Prepare old staging container
        if: steps.test_health.outcome == 'success'
        run: |
          docker rm -f homeops-staging-old || true
          docker rename homeops-staging homeops-staging-old
          docker stop homeops-staging-old

      - name: Start promoted staging container
        id: promote
        if: steps.test_health.outcome == 'success'
        run: |
          docker run -d \
            --name homeops-staging \
            --restart unless-stopped \
            -p 8000:8000 \
            "$IMAGE"

      - name: Check promoting staging container
        if: failure() && steps.promote.conclusion == 'failure'
        run: |
          printf '%s\n' 'Deploy failure'
          docker logs homeops-staging || true

      - name: Health check promoted container
        id: promoted_health
        if: steps.promote.outcome == 'success'
        env:
          SIMULATE_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure }}
        run: |
          if [[ "$SIMULATE_FAILURE" == 'true' ]]; then
            printf '%s\n' 'Simulated failure: testing staging rollback' >&2
            exit 1
          fi

          sleep 3
          curl --fail http://127.0.0.1:8000/health

      - name: Cleanup old staging container
        if: steps.promoted_health.outcome == 'success'
        run: |
          docker rm homeops-staging-old

      - name: Check homeops-staging-old
        id: check_old
        if: >-
          failure() &&
          steps.test_health.outcome == 'success' &&
          steps.promoted_health.outcome != 'success'
        run: |
          docker container inspect homeops-staging-old --format '{{.Image}}'

      - name: Rollback staging
        id: rollback
        if: >-
          failure() &&
          steps.promoted_health.outcome != 'success' &&
          steps.check_old.outcome == 'success' &&
          steps.promote.outcome != 'success'
        run: |
          if [ "${{ steps.promoted_health.conclusion }}" = "skipped" ]; then
            printf '%s\n' 'Deploy failure: start rollback' >&2
          else
            printf '%s\n' 'Post-Deploy failure: start rollback' >&2
          fi
          docker logs homeops-staging || true
          docker rm -f homeops-staging || true
          docker start homeops-staging-old
          docker rename homeops-staging-old homeops-staging

      - name: Health check old container after Rollback
        id: rollback_health
        if: failure() && steps.rollback.outcome == 'success'
        run: |
          sleep 3
          curl --fail http://127.0.0.1:8000/health

      - name: Show failed container logs after Rollback
        if: >-
          failure() &&
          (steps.rollback_health.outcome == 'failure' ||
          steps.rollback.outcome == 'failure')
        run: |
          printf '%s\n' 'ERROR: Rollback or post-rollback health check failed' >&2
          docker logs --tail 50 homeops-staging || true
          docker logs --tail 50 homeops-staging-old || true

      - name: Cleanup temporary container
        if: always()
        run: |
          docker rm -f homeops-staging-new || true

      - name: Cleanup staging images
        id: cleanup_images
        shell: bash
        env:
          DRY_RUN: 'false'
          LC_ALL: C
        run: |
          set -euo pipefail

          CANDIDATES=$(
            docker image ls --no-trunc \
              --filter 'reference=homeops-staging:*' \
              --filter 'reference=ghcr.io/koptchik/homeops:*' \
              --format '{{.ID}}' |
              sort -u |
              xargs -r docker image inspect --format '{{.Id}} {{.Created}}' |
              sort -k2,2r |
              tail -n +3 |
              awk '{print $1}' |
              sort -u
          ) || {
            printf '%s\n' 'ERROR: Failed to collect image cleanup candidates' >&2
            exit 1
          }

          USED=$(
            docker container ls -aq |
              xargs -r docker container inspect --format '{{.Image}}' |
              sort -u
          ) || {
            printf '%s\n' 'ERROR: Failed to collect images used by containers' >&2
            exit 1
          }

          IMAGES=$(comm -23 \
              <(printf '%s\n' "$CANDIDATES") \
              <(printf '%s\n' "$USED")
            )

          if [[ -z "$IMAGES" ]]; then
            printf '%s\n' 'No staging image cleanup candidates'
            exit 0
          fi

          while IFS= read -r IMAGE; do
            [[ -n "$IMAGE" ]] || continue

            TAG_TEXT=$(
              docker image inspect "$IMAGE" \
                --format '{{range .RepoTags}}{{println .}}{{end}}'
            )
            DIGEST_TEXT=$(
              docker image inspect "$IMAGE" \
                --format '{{range .RepoDigests}}{{println .}}{{end}}'
            )

            if [[ -z "$TAG_TEXT" ]]; then
              printf 'Skip %s: no tags\n' "$IMAGE"
              continue
            fi

            mapfile -t TAGS <<< "$TAG_TEXT"
            FOREIGN=false

            for TAG in "${TAGS[@]}"; do
              case "$TAG" in
                homeops-staging:*|ghcr.io/koptchik/homeops:*)
                ;;
              *)
                FOREIGN=true
                break
                ;;
              esac
            done

            while IFS= read -r DIGEST; do
              [[ -n "$DIGEST" ]] || continue
               case "$DIGEST" in ghcr.io/koptchik/homeops@sha256:*)
                ;;
              *)
                FOREIGN=true
                break
                ;;
              esac
            done <<< "$DIGEST_TEXT"
              
            if [[ "$FOREIGN" == true ]]; then
              printf 'Skip %s: references outside managed repositories\n' "$IMAGE"
              continue
            fi

            for TAG in "${TAGS[@]}"; do
              CURRENT_ID=$(docker image inspect "$TAG" --format '{{.Id}}')
              if [[ "$CURRENT_ID" != "$IMAGE" ]]; then
                printf 'ERROR: Tag changed during cleanup: %s\n' "$TAG" >&2
                exit 1
              fi
            done

            USED_NOW=$(
              docker container ls -aq |
                xargs -r docker container inspect --format '{{.Image}}' |
                sort -u
            ) || {
              printf '%s\n' 'ERROR: Failed to recheck container images' >&2
              exit 1
            }

            if grep -Fxq "$IMAGE" <<< "$USED_NOW"; then
              printf 'Skip %s: image is now used by a container\n' "$IMAGE"
              continue
            fi

            printf 'Selected image: %s\n' "$IMAGE"
            printf '  Tag: %s\n' "${TAGS[@]}"

            if [[ "$DRY_RUN" == 'false' ]]; then
              docker image rm "${TAGS[@]}"
            else
              printf '%s\n' 'DRY RUN: nothing deleted'
            fi
          done < <(printf '%s\n' "$IMAGES")